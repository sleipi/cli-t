name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-dash:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: make test
      - run: make e2e
      - run: make examples

  test-ash:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
    container: golang:${{ matrix.go-version }}-alpine
    steps:
      - uses: actions/checkout@v7
      - run: apk add --no-cache make
      - run: make test
      - run: make e2e
      - run: make examples

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: make test
      - run: make e2e
      - run: make examples

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
