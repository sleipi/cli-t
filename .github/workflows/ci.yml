name: CI

on:
  pull_request:
  release:
    types: [published]

jobs:
  test-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: make test
      - run: make e2e
      - run: make examples

  test-ash:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - uses: actions/checkout@v6
      - run: apk add --no-cache make
      - run: make test
      - run: make e2e
      - run: make examples

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: make test
      - run: make e2e
      - run: make examples

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
