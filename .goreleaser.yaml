version: 2

builds:
  - main: ./cmd/clitest/
    binary: clitest
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: cli-t
    binaries:
      - clitest
    repository:
      owner: sleipi
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/sleipi/cli-t
    description: "Declarative CLI testing tool"
    caveats: "CLITest installed! Run 'clitest' to start."
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/clitest"]
          end

release:
  prerelease: auto
