version: 2

builds:
  - main: ./cmd/clitest/
    binary: clitest
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: sleipi
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/sleipi/cli-t
    description: "Declarative CLI testing tool"
    license: MIT
    install: |
      bin.install "clitest"
    test: |
      assert_match version.to_s, shell_output("#{bin}/clitest --version")

release:
  prerelease: auto
